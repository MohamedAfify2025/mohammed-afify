<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>مساحتي التعليمية | Mohammed Afify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:Cairo,Tahoma,Arial,sans-serif;padding:20px}
main{max-width:850px;margin:24px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e3eaf2;border-radius:20px;padding:25px;margin:16px 0;box-shadow:0 12px 35px #17243b09}
.brand{font-weight:900;color:#0b8379}.muted{color:#6a7890;font-size:13px;line-height:1.9}h1{font-size:30px;margin:9px 0}button,a{display:inline-block;border:0;border-radius:10px;padding:10px 15px;background:#14233d;color:#fff;font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}
.notice{padding:14px;border-radius:11px;background:#e8f7f1;color:#126447;font-size:13px;line-height:1.9;margin:14px 0}.notice.error{background:#fff0f0;color:#9b2632}.notice[hidden]{display:none}
li{padding:12px 0;border-bottom:1px solid #e9eef4;font-size:14px}ul{padding-right:22px}
.course-item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.course-name{font-weight:800}.course-slug{display:block;color:#7a8799;font-size:11px;direction:ltr;text-align:right;margin-top:3px}
.permission-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.permission-badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 8px;background:#eef1f5;color:#69778b;font-size:11px;font-weight:700}
.permission-badge.yes{background:#e5f7ef;color:#14704c}
.lesson-list{width:100%;padding:12px;background:#f7f9fc;border:1px solid #e8edf3;border-radius:12px;margin-top:8px}
.lesson-heading{font-size:12px;font-weight:800;color:#42516a;margin-bottom:8px}
.lesson-open{background:#0b8379;color:#fff;margin:4px 0}.lesson-open:disabled{opacity:.6;cursor:wait}
.lesson-viewer{background:#fff;border:1px solid #dfe7f0;border-radius:18px;overflow:hidden;margin-top:18px}
.lesson-viewer[hidden]{display:none}
.lesson-viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#14233d;color:#fff}
.lesson-viewer-head strong{font-size:14px}
#closeLesson{background:#fff;color:#14233d;padding:7px 12px}
#lessonFrame{display:block;width:100%;height:min(78vh,900px);border:0;background:#fff}
</style></head>
<body><main>
<header class="top"><div class="brand">MOHAMMED AFIFY · LEARNING SPACE</div><button id="logoutButton" type="button">تسجيل الخروج</button></header>
<section class="card">
<p class="muted">مساحتك التعليمية الشخصية</p><h1>أهلًا <span id="studentName">بك</span></h1><p class="muted" id="studentEmail"></p>
<div id="pageMessage" class="notice" hidden></div>
<div id="coursePanel" hidden><h2>الدورات وصلاحيات حسابك</h2><ul id="courseList"></ul><p class="muted">تعرض هذه القائمة صلاحياتك لكل دورة. لن تتمكن من فتح أي درس أو ملف إلا إذا كانت صلاحيته مفعّلة.</p></div>
</section>
<section id="lessonViewer" class="lesson-viewer" hidden>
  <div class="lesson-viewer-head"><strong id="lessonTitle">المحاضرة</strong><button id="closeLesson" type="button">إغلاق المحاضرة</button></div>
  <iframe id="lessonFrame" title="المحاضرة التعليمية" sandbox="allow-scripts allow-forms allow-downloads" referrerpolicy="no-referrer"></iframe>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/membership-config.local.js"></script>
<script src="assets/js/membership-config.js"></script>
<script src="assets/js/student-space.js" defer></script>
</body></html>
