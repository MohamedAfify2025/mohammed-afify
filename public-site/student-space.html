<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:Cairo,Tahoma,Arial,sans-serif;padding:20px}
main{max-width:1180px;margin:24px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e3eaf2;border-radius:20px;padding:25px;margin:16px 0;box-shadow:0 12px 35px #17243b09}
.brand{font-weight:900;color:#0b8379}.muted{color:#6a7890;font-size:13px;line-height:1.9}h1{font-size:30px;margin:9px 0}button,a{display:inline-block;border:0;border-radius:10px;padding:10px 15px;background:#14233d;color:#fff;font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}

.course-tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 13px;margin:14px 0 18px;scrollbar-width:thin}
.course-tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;border:1px solid #dfe7f0;border-radius:12px;padding:10px 14px;background:#f7f9fc;color:#43536c;font-size:12px;font-weight:800;white-space:nowrap}

.course-tab[aria-selected="true"] .course-tab-count{background:#0b8379;color:#fff}

.lesson-open.completed{background:#e7f6ef;color:#116a4d}
.course-view-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 6px}

.course-item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.course-name{font-weight:800}
.course-open{display:inline-block;border:0;background:transparent;padding:0;color:inherit;font:inherit;font-weight:800;text-align:right;cursor:pointer}.course-open:hover{color:#0b8379;text-decoration:underline;text-underline-offset:4px}.course-slug{display:block;color:#7a8799;font-size:11px;direction:ltr;text-align:right;margin-top:3px}
.permission-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.permission-badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 8px;background:#eef1f5;color:#69778b;font-size:11px;font-weight:700}
.permission-badge.yes{background:#e5f7ef;color:#14704c}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.admin-link{background:#0b8379}
.nav-link{background:#edf2f8;color:#243650}
.course-item-selected{background:#f0fbf7;border:1px solid #a9dfd0;border-radius:12px;padding:16px;margin-block:8px;box-shadow:0 8px 22px #0b837911}
.admin-link.secondary-admin{background:#edf2f8;color:#243650}
.admin-access-badge{display:inline-flex;align-items:center;border-radius:20px;padding:5px 10px;background:#e5f7ef;color:#14704c;font-size:11px;font-weight:800}
.lesson-list{width:100%;padding:12px;background:#f7f9fc;border:1px solid #e8edf3;border-radius:12px;margin-top:8px}
.lesson-heading{font-size:12px;font-weight:800;color:#42516a;margin-bottom:8px}
.lesson-open{background:#0b8379;color:#fff;margin:4px 0}.lesson-open:disabled{opacity:.6;cursor:wait}
.course-action-row{flex:0 0 100%;width:100%;display:flex;align-items:center;margin-top:4px}
.odoo-intro-link{padding:11px 18px;font-size:13px;box-shadow:0 5px 14px #0b837922}
.odoo-intro-link:hover{background:#086c64}
.lesson-viewer{background:#fff;border:1px solid #dfe7f0;border-radius:18px;overflow:hidden;margin-top:18px}
.lesson-viewer[hidden]{display:none}
.lesson-viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#14233d;color:#fff}
.lesson-viewer-head strong{font-size:14px}
.lesson-viewer-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#completeLessonButton{background:#0b8379;color:#fff;padding:7px 12px}
#completeLessonButton:disabled{background:#e5f7ef;color:#14704c;cursor:default}
#closeLesson{background:#fff;color:#14233d;padding:7px 12px}
#lessonFrame{display:block;width:100%;height:min(78vh,900px);border:0;background:#fff}
</style><style>

.lesson-unit-description{margin:0 0 10px;color:#718098;font-size:12px;line-height:1.8}
.lesson-unit .muted{font-size:12px;margin:8px 0}
