<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#17243b;font-family:Cairo,Tahoma,Arial,sans-serif;padding:20px}
main{width:min(100%,540px);background:#fff;border:1px solid #e3eaf2;border-radius:22px;padding:clamp(24px,5vw,42px);box-shadow:0 18px 50px #17243b10}
.brand{font-weight:900;color:#0b8379}.muted{color:#6a7890;font-size:13px;line-height:1.9}h1{font-size:26px;margin:10px 0}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input{width:100%;border:1px solid #d9e2ed;border-radius:10px;padding:12px;font:inherit}button,a{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}button{background:#19b7a2;color:#062b2a;width:100%;margin-top:18px}.notice{padding:12px;border-radius:10px;background:#e8f7f1;color:#126447;font-size:13px;margin:14px 0}.notice.error{background:#fff0f0;color:#9b2632}.notice[hidden],form[hidden]{display:none}
</style>  <link rel="stylesheet" href="assets/css/platform-finish-v1.css">

<body class="ma-platform-page ma-platform-login"><main>
<div class="brand">MOHAMMED AFIFY · LEARNING</div>
<h1>إعداد كلمة المرور</h1>
<p class="muted">مرحبًا بك. استخدم هذه الصفحة من رابط الدعوة الذي وصل إلى بريدك الإلكتروني لإنشاء كلمة مرور خاصة بحسابك.</p>
<p class="muted">الحساب: <strong id="studentEmail">جارٍ التحقق من الدعوة…</strong></p>
<div id="pageMessage" class="notice" hidden></div>
<form id="passwordForm" hidden>
<label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="10" autocomplete="new-password" required>
<label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required>
<button id="savePasswordButton" type="submit">حفظ كلمة المرور</button>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
