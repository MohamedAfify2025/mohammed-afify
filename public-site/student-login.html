<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow"><title>دخول المتدربين | Mohammed Afify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#17243b;font-family:Cairo,Tahoma,Arial,sans-serif;padding:20px}
main{width:min(100%,520px);background:#fff;border:1px solid #e3eaf2;border-radius:22px;padding:clamp(24px,5vw,42px);box-shadow:0 18px 50px #17243b10}
.brand{font-weight:900;color:#0b8379}.muted{color:#6a7890;font-size:13px;line-height:1.9}h1{font-size:27px;margin:10px 0}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input{width:100%;border:1px solid #d9e2ed;border-radius:10px;padding:12px;font:inherit}button,a{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}button{background:#14233d;color:#fff;width:100%;margin-top:16px}.secondary{background:#edf2f8;color:#243650}.notice{padding:12px;border-radius:10px;background:#e8f7f1;color:#126447;font-size:13px;margin:14px 0}.notice.error{background:#fff0f0;color:#9b2632}.notice[hidden]{display:none}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}
</style></head>
<body><main>
<div class="brand">MOHAMMED AFIFY · LEARNING</div>
<h1>تسجيل دخول المتدربين</h1>
<p class="muted">استخدم بريدك الإلكتروني وكلمة المرور التي أنشأتها عند قبول الدعوة.</p>
<div id="pageMessage" class="notice" hidden></div>
<form id="loginForm">
<label for="email">البريد الإلكتروني — اسم المستخدم</label><input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit">دخول إلى مساحتي التعليمية</button>
</form>
<div class="links"><button id="resetButton" type="button" class="secondary">نسيت كلمة المرور؟</button><a class="secondary" href="index.html">الرئيسية</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/membership-config.local.js"></script>
<script src="assets/js/membership-config.js"></script>
<script src="assets/js/student-login.js" defer></script>
</body></html>
