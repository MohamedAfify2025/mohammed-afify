name: Student invitation checks

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/Deploy-UsernameStudentAccounts-LIVE.ps1"
      - "scripts/Backup-LIVE-Supabase.ps1"
      - "sql/student-username-accounts-live-preflight.sql"
      - "docs/USERNAME-STUDENT-ACCOUNTS-LIVE-ROLLOUT.md"
      - "scripts/Deploy-StudentInvitations-TEST.ps1"
      - "scripts/Deploy-StudentInvitations-LIVE.ps1"
      - "public-site/admin-students.html"
      - "public-site/admin-dashboard.html"
      - "public-site/admin-student-accounts.html"
      - "public-site/admin-subscriptions.html"
      - "public-site/academy-access.html"
      - "public-site/student-*.html"
      - "public-site/assets/js/admin-students.js"
      - "public-site/assets/js/admin-student-accounts.js"
      - "public-site/assets/js/admin-dashboard.js"
      - "public-site/assets/js/admin-subscriptions.js"
      - "public-site/assets/js/student-*.js"
      - "public-site/assets/js/academy-access.js"
      - "public-site/assets/js/membership-config.js"
      - "tests/student-invites.test.mjs"
      - "tests/student-account-helpers.test.mjs"
      - "tests/student-username-login.test.mjs"
      - "tests/admin-subscriptions-ui.test.mjs"
      - "tests/role-permissions.test.mjs"
      - "sql/membership-v2-per-user-course-permissions.sql"
      - "docs/MEMBERSHIP-V2-THREE-ROLE-ACCESS.md"
      - ".github/workflows/student-invitations-tests.yml"
  push:
    branches:
      - "main"
      - "feature/student-invitations-and-login-2026-11-23"
      - "feature/student-invitations-live-deploy-2026-11-23"
      - "feature/three-role-course-permissions"
      - "feature/username-student-accounts-20261125"
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/Deploy-UsernameStudentAccounts-LIVE.ps1"
      - "scripts/Backup-LIVE-Supabase.ps1"
      - "sql/student-username-accounts-live-preflight.sql"
      - "scripts/Deploy-StudentInvitations-TEST.ps1"
      - "scripts/Deploy-StudentInvitations-LIVE.ps1"
      - "public-site/admin-students.html"
      - "public-site/admin-subscriptions.html"
      - "public-site/academy-access.html"
      - "public-site/student-*.html"
      - "public-site/assets/js/admin-students.js"
      - "public-site/assets/js/admin-subscriptions.js"
      - "public-site/assets/js/student-*.js"
      - "public-site/assets/js/academy-access.js"
      - "public-site/assets/js/membership-config.js"
      - "tests/student-invites.test.mjs"
      - "tests/admin-subscriptions-ui.test.mjs"
      - "tests/role-permissions.test.mjs"
      - ".github/workflows/student-invitations-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test invitation validation
        run: |
          node tests/student-invites.test.mjs
          node tests/student-account-helpers.test.mjs
          node tests/student-username-login.test.mjs
          node tests/admin-subscriptions-ui.test.mjs
          node tests/role-permissions.test.mjs
      - name: Syntax-check browser scripts
        run: |
          node --check public-site/assets/js/membership-config.js
          node --check public-site/assets/js/admin-students.js
          node --check public-site/assets/js/admin-student-accounts.js
          node --check public-site/assets/js/admin-dashboard.js
          node --check public-site/assets/js/admin-subscriptions.js
          node --check public-site/assets/js/student-login.js
          node --check public-site/assets/js/student-set-password.js
          node --check public-site/assets/js/student-space.js
          node --check public-site/assets/js/academy-access.js

  edge-function-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the admin invitation Edge Function
        run: |
          deno check supabase/functions/admin-create-student-invitations/index.ts
          deno check supabase/functions/admin-manage-student-accounts/index.ts

  powershell-script-parse:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Parse deployment scripts
        shell: powershell
        run: |
          $scripts = @(
            "scripts/Deploy-StudentInvitations-LIVE.ps1",
            "scripts/Deploy-UsernameStudentAccounts-LIVE.ps1",
            "scripts/Backup-LIVE-Supabase.ps1"
          )
          foreach ($relativePath in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $scriptPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $relativePath"
              $sourceLines = Get-Content -LiteralPath $scriptPath
              foreach ($parseError in $parseErrors) {
                $lineNumber = $parseError.Extent.StartLineNumber
                $columnNumber = $parseError.Extent.StartColumnNumber
                Write-Host ("Line {0}, Column {1}: {2} [{3}]" -f $lineNumber, $columnNumber, $parseError.Message, $parseError.ErrorId)
                if ($lineNumber -gt 0 -and $lineNumber -le $sourceLines.Count) {
                  Write-Host $sourceLines[$lineNumber - 1]
                }
              }
              throw "PowerShell parse failed: $relativePath"
            }
          }
          $backupScriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts/Backup-LIVE-Supabase.ps1"
          $backupSource = Get-Content -LiteralPath $backupScriptPath -Raw
          foreach ($guard in @(
            'Get-Command "supabase" -CommandType Application',
            'Get-Command "docker" -CommandType Application',
            'Start-Process -FilePath $dockerPath',
            'Target: project',
            '$ErrorActionPreference = "Continue"',
            'PSNativeCommandUseErrorActionPreference = $false',
            'BACKUP-STATUS-INCOMPLETE.txt',
            'Read-Host -AsSecureString',
            '/object/sign/$bucket/$encodedPath',
            '/object/public/$bucket/$encodedPath',
            'expiresIn = 3600',
            'signedURL',
            'Invoke-RestMethod -Method Post',
            'Get-Command "curl.exe" -CommandType Application',
            '--location --fail --silent --show-error',
            'PowerShell stack:',
            'Download-LiveStorageObjects $inventoryRows $Buckets $storageRoot',
            'storage-download-failures.csv',
            'Storage backup is PARTIAL',
            'ybsjnubrswqksvktgmay'
          )) {
            if (-not $backupSource.Contains($guard)) {
              throw "Backup helper is missing expected safety guard: $guard"
            }
          }
          if ($backupSource.Contains('Invoke-SupabaseCli @("storage", "cp"')) {
            throw "Backup helper must not use the unsupported remote-to-local storage cp command."
          }
          if (($backupSource.ToCharArray() | Measure-Object).Count -gt 50000) {
            throw "Backup helper source unexpectedly large; inspect for accidental duplicated content."
          }
          Write-Host "PowerShell syntax and LIVE backup safety-guard checks passed."
